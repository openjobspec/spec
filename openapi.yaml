openapi: 3.1.0
info:
  title: Open Job Spec HTTP API
  version: 1.0.0-rc.1
  description: |
    The Open Job Spec (OJS) HTTP/REST API for universal background job processing.

    OJS defines a vendor-neutral envelope format, an 8-state job lifecycle, and a
    standard set of operations for enqueuing, processing, and managing background jobs.

    ## Job Lifecycle State Machine

    Jobs progress through the following states:

    ```
    scheduled → available → active → completed
                    ↑          ↓
                pending    retryable
                              ↓
                          discarded
    ```

    All non-terminal states may transition to `cancelled`.

    | State       | Description                                              |
    |-------------|----------------------------------------------------------|
    | scheduled   | Waiting for scheduled_at time to arrive                  |
    | available   | Ready to be fetched by a worker                          |
    | pending     | Transitional state during internal routing                |
    | active      | Currently being processed by a worker                    |
    | completed   | Successfully processed (terminal)                        |
    | retryable   | Failed but eligible for retry                            |
    | cancelled   | Cancelled by client or system (terminal)                 |
    | discarded   | Failed and exhausted all retry attempts (terminal)       |

    ## Content Type

    All requests and responses use `application/openjobspec+json`.
    Servers also accept `application/json` as an alias.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    name: OpenJobSpec
    url: https://openjobspec.org

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: System
    description: Health checks and server capability discovery
  - name: Jobs
    description: Job lifecycle operations — enqueue, get, cancel, batch
  - name: Workers
    description: Worker-side operations — fetch, ack, nack, heartbeat
  - name: Queues
    description: Queue listing, statistics, pause, and resume
  - name: Dead Letter
    description: Dead letter queue management — list, retry, delete
  - name: Cron
    description: Cron job registration and management
  - name: Workflows
    description: Workflow orchestration — chain, group, batch primitives
  - name: Schema Registry
    description: Job type schema registration, versioning, and validation
  - name: Debug
    description: Experimental debugging endpoints — not available on all backends
  - name: Admin
    description: Administrative operations — job management, queue control, worker monitoring
  - name: Events
    description: Real-time event streaming via SSE and WebSocket

paths:
  # ── System ──────────────────────────────────────────────────────────
  /ojs/manifest:
    get:
      operationId: getManifest
      summary: Get conformance manifest
      description: |
        Returns the server's conformance manifest including supported spec version,
        implementation details, conformance level, and enabled capabilities.
        This endpoint is unversioned so clients can discover supported versions.
      tags: [System]
      responses:
        "200":
          description: Conformance manifest
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/Manifest"

  /ojs/v1/health:
    get:
      operationId: getHealth
      summary: Health check
      description: |
        Returns the health status of the OJS server and its backend connection.
        Returns 200 when healthy, 503 when degraded or unavailable.
      tags: [System]
      responses:
        "200":
          description: Server is healthy
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: "ok"
                version: "1.0"
                uptime_seconds: 86400
                backend:
                  type: "redis"
                  status: "connected"
                  latency_ms: 2
        "503":
          description: Server is unhealthy or backend is unavailable
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /ojs/v1/health/detail:
    get:
      operationId: getHealthDetail
      summary: Detailed health check
      description: |
        Returns detailed health information including backend diagnostics,
        queue depths, worker counts, and resource utilization. Provides more
        granular information than the basic health endpoint for monitoring dashboards.
      tags: [System]
      responses:
        "200":
          description: Detailed health information
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/HealthDetailResponse"
              example:
                status: "ok"
                version: "1.0"
                uptime_seconds: 86400
                backend:
                  type: "redis"
                  status: "connected"
                  latency_ms: 2
                  version: "7.2.4"
                queues:
                  total: 5
                  active: 4
                  paused: 1
                workers:
                  total: 12
                  active: 10
                  quiet: 2
                jobs:
                  total: 158420
                  active: 45
                  available: 230
                  scheduled: 18
                server_time: "2026-03-15T10:30:00Z"
        "503":
          description: Server is unhealthy
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/HealthDetailResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Jobs ────────────────────────────────────────────────────────────
  /ojs/v1/jobs:
    post:
      operationId: createJob
      summary: Enqueue a job
      description: |
        Submits a single job for processing (PUSH operation).

        The server assigns a UUIDv7 `id` if the client does not provide one.
        The initial state is `available`, or `scheduled` if `scheduled_at` is in the future.
      tags: [Jobs]
      requestBody:
        required: true
        content:
          application/openjobspec+json:
            schema:
              $ref: "#/components/schemas/EnqueueRequest"
            example:
              type: "email.send"
              args: ["user@example.com", "Welcome to OpenJobSpec!", {"html": true}]
              meta: {"trace_id": "trace-abc123", "correlation_id": "order-789"}
              options:
                queue: "email"
                priority: 5
                retry:
                  max_attempts: 3
                  initial_interval: "PT1S"
                  backoff_coefficient: 2.0
                tags: ["transactional", "welcome"]
      responses:
        "201":
          description: Job created
          headers:
            Location:
              schema:
                type: string
              description: URI of the created job (e.g. `/ojs/v1/jobs/{id}`)
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/JobResponse"
              example:
                job:
                  id: "01912b4c-8e3a-7000-8000-000000000001"
                  type: "email.send"
                  state: "available"
                  queue: "email"
                  args: ["user@example.com", "Welcome to OpenJobSpec!", {"html": true}]
                  meta: {"trace_id": "trace-abc123", "correlation_id": "order-789"}
                  priority: 5
                  attempt: 0
                  max_attempts: 3
                  created_at: "2026-03-15T10:30:00Z"
                  enqueued_at: "2026-03-15T10:30:00Z"
                  tags: ["transactional", "welcome"]
        "200":
          description: Existing job returned (unique job conflict with `use_existing` policy)
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /ojs/v1/jobs/{id}:
    get:
      operationId: getJob
      summary: Get job details
      description: |
        Retrieves the current state and metadata of a job (INFO operation).
        Returns the complete job object including state, timestamps, and result/error data.
      tags: [Jobs]
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job details
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/JobResponse"
              example:
                job:
                  id: "01912b4c-8e3a-7000-8000-000000000001"
                  type: "image.resize"
                  state: "active"
                  queue: "media"
                  args: ["s3://bucket/photo.jpg", {"width": 800, "height": 600, "format": "webp"}]
                  meta: {"user_id": "user-42", "request_id": "req-xyz"}
                  priority: 0
                  attempt: 1
                  max_attempts: 3
                  timeout_ms: 60000
                  worker_id: "worker-03.eu-west-1"
                  created_at: "2026-03-15T10:28:00Z"
                  enqueued_at: "2026-03-15T10:28:00Z"
                  started_at: "2026-03-15T10:30:05Z"
                  tags: ["media", "resize"]
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: cancelJob
      summary: Cancel a job
      description: |
        Cancels a job (CANCEL operation).

        Transitions the job to `cancelled` if it is in a non-terminal state
        (`available`, `scheduled`, `pending`, `active`, `retryable`).
        Returns 409 if the job is already in a terminal state.
      tags: [Jobs]
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job cancelled
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/JobResponse"
              example:
                job:
                  id: "01912b4c-8e3a-7000-8000-000000000001"
                  type: "report.generate"
                  state: "cancelled"
                  queue: "reports"
                  args: [{"report_type": "monthly", "month": "2026-02"}]
                  attempt: 0
                  max_attempts: 3
                  created_at: "2026-03-15T10:00:00Z"
                  cancelled_at: "2026-03-15T10:30:00Z"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /ojs/v1/jobs/batch:
    post:
      operationId: createJobBatch
      summary: Batch enqueue jobs
      description: |
        Submits multiple jobs atomically (batch PUSH operation).

        Either all jobs are enqueued or none are. If any job in the batch fails
        validation, the entire batch is rejected.
      tags: [Jobs]
      requestBody:
        required: true
        content:
          application/openjobspec+json:
            schema:
              $ref: "#/components/schemas/BatchEnqueueRequest"
            example:
              jobs:
                - type: "email.send"
                  args: ["alice@example.com", "Your order shipped"]
                  options:
                    queue: "email"
                    priority: 3
                - type: "analytics.track"
                  args: [{"event": "order_shipped", "user_id": "user-42"}]
                  options:
                    queue: "analytics"
                - type: "webhook.deliver"
                  args: ["https://partner.example.com/hook", {"order_id": "order-789"}]
                  options:
                    queue: "webhooks"
                    retry:
                      max_attempts: 5
      responses:
        "201":
          description: All jobs created
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/BatchEnqueueResponse"
              example:
                jobs:
                  - id: "01912b4c-8e3a-7000-8000-000000000010"
                    type: "email.send"
                    state: "available"
                    queue: "email"
                    args: ["alice@example.com", "Your order shipped"]
                    attempt: 0
                    created_at: "2026-03-15T10:30:00Z"
                  - id: "01912b4c-8e3a-7000-8000-000000000011"
                    type: "analytics.track"
                    state: "available"
                    queue: "analytics"
                    args: [{"event": "order_shipped", "user_id": "user-42"}]
                    attempt: 0
                    created_at: "2026-03-15T10:30:00Z"
                  - id: "01912b4c-8e3a-7000-8000-000000000012"
                    type: "webhook.deliver"
                    state: "available"
                    queue: "webhooks"
                    args: ["https://partner.example.com/hook", {"order_id": "order-789"}]
                    attempt: 0
                    created_at: "2026-03-15T10:30:00Z"
                count: 3
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Workers ─────────────────────────────────────────────────────────
  /ojs/v1/workers/fetch:
    post:
      operationId: fetchJobs
      summary: Fetch jobs for processing
      description: |
        Claims one or more jobs for processing (FETCH operation).

        Atomically transitions fetched jobs from `available` to `active`.
        The response may contain fewer jobs than requested if fewer are available.
        An empty `jobs` array indicates no work is available.
      tags: [Workers]
      requestBody:
        required: true
        content:
          application/openjobspec+json:
            schema:
              $ref: "#/components/schemas/FetchRequest"
            example:
              queues: ["email", "default"]
              count: 5
              worker_id: "worker-01.us-east-1"
              visibility_timeout_ms: 30000
      responses:
        "200":
          description: Jobs fetched (may be empty)
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/FetchResponse"
              example:
                jobs:
                  - id: "01912b4c-8e3a-7000-8000-000000000001"
                    type: "email.send"
                    state: "active"
                    queue: "email"
                    args: ["user@example.com", "Welcome to OpenJobSpec!", {"html": true}]
                    attempt: 1
                    max_attempts: 3
                    worker_id: "worker-01.us-east-1"
                    created_at: "2026-03-15T10:30:00Z"
                    started_at: "2026-03-15T10:30:05Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /ojs/v1/workers/ack:
    post:
      operationId: ackJob
      summary: Acknowledge job completion
      description: |
        Marks a job as successfully completed (ACK operation).

        Transitions the job from `active` to `completed`.
        Returns 409 if the job is not in the `active` state.
      tags: [Workers]
      requestBody:
        required: true
        content:
          application/openjobspec+json:
            schema:
              $ref: "#/components/schemas/AckRequest"
            example:
              job_id: "01912b4c-8e3a-7000-8000-000000000001"
              result: {"delivered": true, "message_id": "msg-20260315-abc"}
      responses:
        "200":
          description: Job acknowledged
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/AckResponse"
              example:
                acknowledged: true
                job_id: "01912b4c-8e3a-7000-8000-000000000001"
                state: "completed"
                completed_at: "2026-03-15T10:30:07Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /ojs/v1/workers/nack:
    post:
      operationId: nackJob
      summary: Report job failure
      description: |
        Reports that a job handler failed (FAIL operation).

        Transitions the job to `retryable` if attempts remain, or `discarded`
        if max attempts are exhausted. The response indicates the resulting state
        and, if retryable, the scheduled time for the next attempt.
      tags: [Workers]
      requestBody:
        required: true
        content:
          application/openjobspec+json:
            schema:
              $ref: "#/components/schemas/NackRequest"
            example:
              job_id: "01912b4c-8e3a-7000-8000-000000000001"
              error:
                code: "SMTP_TIMEOUT"
                type: "connection_error"
                message: "SMTP server connection timed out after 30s"
                retryable: true
                details: {"host": "smtp.example.com", "port": 587}
      responses:
        "200":
          description: Failure recorded
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/NackResponse"
              example:
                job_id: "01912b4c-8e3a-7000-8000-000000000001"
                state: "retryable"
                attempt: 2
                max_attempts: 5
                next_attempt_at: "2026-03-15T10:31:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /ojs/v1/workers/heartbeat:
    post:
      summary: Worker heartbeat
      description: |
        Extends the visibility timeout of active jobs and reports worker liveness
        (BEAT operation).

        The server may include a `directive` in the response (`quiet` or `terminate`)
        to signal the worker to change its lifecycle state.
      tags: [Workers]
      requestBody:
        required: true
        content:
          application/openjobspec+json:
            schema:
              $ref: "#/components/schemas/HeartbeatRequest"
            example:
              worker_id: "worker-01.us-east-1"
              active_jobs:
                - "01912b4c-8e3a-7000-8000-000000000001"
                - "01912b4c-8e3a-7000-8000-000000000002"
              visibility_timeout_ms: 60000
      responses:
        "200":
          description: Heartbeat acknowledged
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/HeartbeatResponse"
              example:
                state: "active"
                directive: ""
                jobs_extended:
                  - "01912b4c-8e3a-7000-8000-000000000001"
                  - "01912b4c-8e3a-7000-8000-000000000002"
                server_time: "2026-03-15T10:30:30Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Queues ──────────────────────────────────────────────────────────
  /ojs/v1/queues:
    get:
      operationId: listQueues
      summary: List queues
      description: Returns all known queues with their status and pagination.
      tags: [Queues]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 1000
          description: Maximum number of queues to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of queues to skip
      responses:
        "200":
          description: Queue list
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/QueueListResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /ojs/v1/queues/{name}/stats:
    get:
      operationId: getQueueStats
      summary: Get queue statistics
      description: Returns detailed statistics for a specific queue including job counts by state.
      tags: [Queues]
      parameters:
        - $ref: "#/components/parameters/QueueName"
      responses:
        "200":
          description: Queue statistics
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/QueueStatsResponse"
              example:
                queue:
                  name: "email"
                  available: 142
                  active: 8
                  completed: 15200
                  paused: false
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /ojs/v1/queues/{name}/pause:
    post:
      operationId: pauseQueue
      summary: Pause a queue
      description: |
        Pauses a queue, preventing workers from fetching new jobs from it.
        Jobs already active continue processing.
      tags: [Queues]
      parameters:
        - $ref: "#/components/parameters/QueueName"
      responses:
        "200":
          description: Queue paused
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/QueuePauseResumeResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /ojs/v1/queues/{name}/resume:
    post:
      operationId: resumeQueue
      summary: Resume a queue
      description: Resumes a paused queue, allowing workers to fetch jobs again.
      tags: [Queues]
      parameters:
        - $ref: "#/components/parameters/QueueName"
      responses:
        "200":
          description: Queue resumed
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/QueuePauseResumeResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Dead Letter ─────────────────────────────────────────────────────
  /ojs/v1/dead-letter:
    get:
      operationId: listDeadLetterJobs
      summary: List dead letter jobs
      description: Returns jobs in the dead letter queue with pagination support.
      tags: [Dead Letter]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 1000
          description: Maximum number of jobs to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of jobs to skip
      responses:
        "200":
          description: Dead letter job list
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/DeadLetterListResponse"
              example:
                jobs:
                  - id: "01912b4c-8e3a-7000-8000-000000000099"
                    type: "webhook.deliver"
                    state: "discarded"
                    queue: "webhooks"
                    args: ["https://partner.example.com/hook", {"event": "order.created"}]
                    attempt: 5
                    max_attempts: 5
                    created_at: "2026-03-14T08:00:00Z"
                    completed_at: "2026-03-15T09:00:00Z"
                    error: {"code": "HTTP_502", "message": "Bad gateway from partner API"}
                    errors:
                      - {"code": "HTTP_502", "message": "Bad gateway", "attempt": 3}
                      - {"code": "HTTP_502", "message": "Bad gateway", "attempt": 4}
                      - {"code": "HTTP_502", "message": "Bad gateway", "attempt": 5}
                pagination:
                  total: 23
                  limit: 50
                  offset: 0
                  has_more: false
        "500":
          $ref: "#/components/responses/InternalError"

  /ojs/v1/dead-letter/{id}/retry:
    post:
      summary: Retry a dead letter job
      description: Re-enqueues a dead letter job for processing, resetting its attempt count.
      tags: [Dead Letter]
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job re-enqueued
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /ojs/v1/dead-letter/{id}:
    delete:
      operationId: deleteDeadLetterJob
      summary: Delete a dead letter job
      description: Permanently removes a job from the dead letter queue.
      tags: [Dead Letter]
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job deleted
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/DeadLetterDeleteResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Cron ────────────────────────────────────────────────────────────
  /ojs/v1/cron:
    get:
      operationId: listCronJobs
      summary: List cron jobs
      description: Returns all registered cron job definitions with pagination.
      tags: [Cron]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 1000
          description: Maximum number of cron jobs to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of cron jobs to skip
      responses:
        "200":
          description: Cron job list
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/CronListResponse"
              example:
                crons:
                  - name: "daily-cleanup"
                    expression: "0 2 * * *"
                    timezone: "UTC"
                    overlap_policy: "skip"
                    enabled: true
                    job_template:
                      type: "maintenance.cleanup"
                      args: [{"max_age_days": 30}]
                    created_at: "2026-01-10T08:00:00Z"
                    next_run_at: "2026-03-16T02:00:00Z"
                    last_run_at: "2026-03-15T02:00:00Z"
                  - name: "hourly-report"
                    expression: "0 * * * *"
                    timezone: "America/New_York"
                    overlap_policy: "allow"
                    enabled: true
                    job_template:
                      type: "report.generate"
                      args: [{"type": "hourly"}]
                    created_at: "2026-02-01T12:00:00Z"
                    next_run_at: "2026-03-15T11:00:00Z"
                    last_run_at: "2026-03-15T10:00:00Z"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: registerCronJob
      summary: Register a cron job
      description: |
        Registers a new cron job that will be enqueued on the specified schedule.
        The `expression` field uses standard cron syntax (5 or 6 fields).
      tags: [Cron]
      requestBody:
        required: true
        content:
          application/openjobspec+json:
            schema:
              $ref: "#/components/schemas/CronJobRequest"
            example:
              name: "daily-cleanup"
              expression: "0 2 * * *"
              timezone: "UTC"
              overlap_policy: "skip"
              job_template:
                type: "maintenance.cleanup"
                args: [{"max_age_days": 30, "tables": ["sessions", "temp_files"]}]
                options:
                  queue: "maintenance"
                  retry:
                    max_attempts: 2
      responses:
        "201":
          description: Cron job registered
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/CronJobResponse"
              example:
                cron:
                  name: "daily-cleanup"
                  expression: "0 2 * * *"
                  timezone: "UTC"
                  overlap_policy: "skip"
                  enabled: true
                  job_template:
                    type: "maintenance.cleanup"
                    args: [{"max_age_days": 30, "tables": ["sessions", "temp_files"]}]
                  created_at: "2026-03-15T10:30:00Z"
                  next_run_at: "2026-03-16T02:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /ojs/v1/cron/{name}:
    delete:
      operationId: deleteCronJob
      summary: Delete a cron job
      description: Unregisters a cron job by name. Future scheduled runs are cancelled.
      tags: [Cron]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Cron job name
      responses:
        "200":
          description: Cron job deleted
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/CronJobResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Workflows ───────────────────────────────────────────────────────
  /ojs/v1/workflows:
    post:
      operationId: createWorkflow
      summary: Create a workflow
      description: |
        Creates and starts a workflow. Supported types:

        - **chain**: Sequential execution — each step runs after the previous completes.
        - **group**: Parallel fan-out/fan-in — all jobs run concurrently.
        - **batch**: Parallel execution with callbacks on completion/failure.
      tags: [Workflows]
      requestBody:
        required: true
        content:
          application/openjobspec+json:
            schema:
              $ref: "#/components/schemas/WorkflowRequest"
            example:
              type: "chain"
              name: "order-processing"
              steps:
                - name: "validate-payment"
                  type: "payment.validate"
                  args: [{"order_id": "order-789", "amount": 99.99, "currency": "USD"}]
                - name: "charge-payment"
                  type: "payment.charge"
                  args: [{"order_id": "order-789"}]
                - name: "send-confirmation"
                  type: "email.send"
                  args: ["customer@example.com", "Order confirmed!"]
              callbacks:
                on_success:
                  type: "notification.send"
                  args: [{"channel": "slack", "message": "Order order-789 processed"}]
                on_failure:
                  type: "alert.trigger"
                  args: [{"severity": "high", "order_id": "order-789"}]
      responses:
        "201":
          description: Workflow created
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
              example:
                workflow:
                  id: "01912b4c-9f00-7000-8000-000000000050"
                  name: "order-processing"
                  type: "chain"
                  state: "active"
                  steps_total: 3
                  steps_completed: 0
                  created_at: "2026-03-15T10:30:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /ojs/v1/workflows/{id}:
    get:
      operationId: getWorkflow
      summary: Get workflow status
      description: Returns the current state and progress of a workflow.
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
      responses:
        "200":
          description: Workflow details
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: cancelWorkflow
      summary: Cancel a workflow
      description: Cancels a workflow and all its pending/active jobs.
      tags: [Workflows]
      parameters:
        - $ref: "#/components/parameters/WorkflowId"
      responses:
        "200":
          description: Workflow cancelled
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/WorkflowResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Job Activation ────────────────────────────────────────────────────
  /ojs/v1/jobs/{id}/activate:
    post:
      operationId: activateJob
      summary: Activate a pending job
      description: |
        Transitions a job from `pending` state to `available`, making it eligible
        for worker processing. This supports staging patterns where jobs must be
        confirmed or approved before execution.
      tags: [Jobs]
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job activated
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /ojs/v1/jobs/{id}/history:
    get:
      operationId: getJobHistory
      summary: Get job state transition history
      description: |
        Returns the complete state transition history for a job, including
        timestamps, the worker involved, and any associated error or result data
        for each transition. Useful for debugging and auditing job execution.
      tags: [Jobs]
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job state history
          content:
            application/openjobspec+json:
              schema:
                $ref: "#/components/schemas/JobHistoryResponse"
              example:
                job_id: "01912b4c-8e3a-7000-8000-000000000001"
                transitions:
                  - from_state: null
                    to_state: "available"
                    timestamp: "2026-03-15T10:30:00Z"
                    reason: "enqueued"
                  - from_state: "available"
                    to_state: "active"
                    timestamp: "2026-03-15T10:30:05Z"
                    reason: "fetched"
                    worker_id: "worker-01.us-east-1"
                  - from_state: "active"
                    to_state: "retryable"
                    timestamp: "2026-03-15T10:30:35Z"
                    reason: "nack"
                    error: {"code": "SMTP_TIMEOUT", "message": "Connection timed out"}
                  - from_state: "retryable"
                    to_state: "available"
                    timestamp: "2026-03-15T10:31:35Z"
                    reason: "retry_scheduled"
                  - from_state: "available"
                    to_state: "active"
                    timestamp: "2026-03-15T10:31:40Z"
                    reason: "fetched"
                    worker_id: "worker-02.us-east-1"
                  - from_state: "active"
                    to_state: "completed"
                    timestamp: "2026-03-15T10:31:42Z"
                    reason: "ack"
                    result: {"delivered": true}
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Durable Execution Checkpoints ───────────────────────────────────
  /ojs/v1/jobs/{id}/checkpoint:
    get:
      operationId: getCheckpoint
      summary: Get job checkpoint
      description: Returns the saved checkpoint state for a job, if any.
      tags: [Jobs]
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Checkpoint found
          content:
            application/openjobspec+json:
              schema:
                type: object
                properties:
                  state:
                    description: Checkpoint state (application-defined)
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: saveCheckpoint
      summary: Save job checkpoint
      description: |
        Saves checkpoint state for a running job. Overwrites any previous
        checkpoint. Used for durable execution crash recovery.
      tags: [Jobs]
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/openjobspec+json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  description: Checkpoint state (application-defined)
      responses:
        "200":
          description: Checkpoint saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteCheckpoint
      summary: Delete job checkpoint
      description: Removes the checkpoint for a job after successful completion.
      tags: [Jobs]
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Checkpoint deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── SSE Event Stream ────────────────────────────────────────────────
  /ojs/v1/events/stream:
    get:
      operationId: eventStream
      summary: Subscribe to real-time events (SSE)
      description: |
        Opens a Server-Sent Events (SSE) stream for real-time job events.
        Use the `channel` parameter to filter events by job ID or queue name.
      tags: [Events]
      parameters:
        - name: channel
          in: query
          required: true
          description: |
            Event channel to subscribe to. Formats:
            - `job:<job_id>` — events for a specific job
            - `queue:<queue_name>` — events for all jobs in a queue
          schema:
            type: string
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Workers List ────────────────────────────────────────────────────
  /ojs/v1/workers:
    get:
      operationId: listWorkers
      summary: List registered workers
      description: Returns all currently registered workers and their status.
      tags: [Workers]
      responses:
        "200":
          description: Worker list
          content:
            application/openjobspec+json:
              schema:
                type: object
                properties:
                  workers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        queues:
                          type: array
                          items:
                            type: string
                        state:
                          type: string
                          enum: [running, quiet, stopping]
                        started_at:
                          type: string
                          format: date-time
        "500":
          $ref: "#/components/responses/InternalError"

  # ── Admin API ────────────────────────────────────────────────────────
  # The Admin API provides operational management endpoints for monitoring
  # and controlling the OJS server. These endpoints are optional and may
  # not be available on all backend implementations.

  /ojs/v1/admin/stats:
    get:
      operationId: adminStats
      summary: Get server statistics
      description: Returns aggregate statistics about jobs, queues, and workers.
      tags: [Admin]
      responses:
        "200":
          description: Server statistics
          content:
            application/json:
              schema:
                type: object
        "500":
          $ref: "#/components/responses/InternalError"

  /ojs/v1/admin/queues:
    get:
      operationId: adminListQueues
      summary: List all queues with details
      description: Returns detailed information about all queues including depth, throughput, and worker counts.
      tags: [Admin]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 1000
          description: Maximum number of queues to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of queues to skip
      responses:
        "200":
          description: Queue list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        "500":
          $ref: "#/components/responses/InternalError"

  /ojs/v1/admin/queues/{name}:
    get:
      operationId: adminGetQueue
      summary: Get queue details
      description: Returns detailed information about a specific queue.
      tags: [Admin]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Queue details
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"

  /ojs/v1/admin/queues/{name}/pause:
    post:
      operationId: adminPauseQueue
      summary: Pause a queue
      description: Pauses job processing for a queue. Workers will stop fetching new jobs.
      tags: [Admin]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Queue paused
        "404":
          $ref: "#/components/responses/NotFound"

  /ojs/v1/admin/queues/{name}/resume:
    post:
      operationId: adminResumeQueue
      summary: Resume a paused queue
      description: Resumes job processing for a previously paused queue.
      tags: [Admin]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Queue resumed
        "404":
          $ref: "#/components/responses/NotFound"

  /ojs/v1/admin/jobs:
    get:
      operationId: adminListJobs
      summary: List jobs with filtering
      description: Returns a filtered, paginated list of jobs for administrative inspection.
      tags: [Admin]
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: queue
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                type: object
        "500":
          $ref: "#/components/responses/InternalError"

  /ojs/v1/admin/jobs/{id}:
    get:
      operationId: adminGetJob
      summary: Get job details
      description: Returns full details of a specific job including metadata and history.
      tags: [Admin]
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/NotFound"

  /ojs/v1/admin/jobs/{id}/retry:
    post:
      operationId: adminRetryJob
      summary: Retry a failed job
      description: Re-enqueues a failed or discarded job for processing.
      tags: [Admin]
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job re-enqueued
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /ojs/v1/admin/jobs/{id}/cancel:
    post:
      operationId: adminCancelJob
      summary: Cancel a job
      description: Cancels a job that is scheduled, available, or active.
      tags: [Admin]
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job cancelled
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /ojs/v1/admin/jobs/bulk/retry:
    post:
      operationId: adminBulkRetry
      summary: Bulk retry failed jobs
      description: Re-enqueues multiple failed jobs matching filter criteria.
      tags: [Admin]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                state:
                  type: string
                queue:
                  type: string
                type:
                  type: string
      responses:
        "200":
          description: Jobs re-enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  retried:
                    type: integer

  /ojs/v1/admin/workers:
    get:
      operationId: adminListWorkers
      summary: List active workers
      description: Returns information about all connected workers.
      tags: [Admin]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 1000
          description: Maximum number of workers to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of workers to skip
      responses:
        "200":
          description: Worker list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /ojs/v1/admin/workers/{id}/quiet:
    post:
      operationId: adminQuietWorker
      summary: Quiet a worker
      description: Signals a worker to stop fetching new jobs and finish active ones.
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Worker quieted
        "404":
          $ref: "#/components/responses/NotFound"

  /ojs/v1/admin/dead-letter:
    get:
      operationId: adminListDeadLetter
      summary: List dead-letter jobs
      description: Returns jobs in the dead-letter queue with pagination.
      tags: [Admin]
      responses:
        "200":
          description: Dead-letter job list
          content:
            application/json:
              schema:
                type: object

  /ojs/v1/admin/dead-letter/stats:
    get:
      operationId: adminDeadLetterStats
      summary: Get dead-letter statistics
      description: Returns aggregate statistics about dead-letter jobs.
      tags: [Admin]
      responses:
        "200":
          description: Dead-letter statistics
          content:
            application/json:
              schema:
                type: object

  /ojs/v1/admin/dead-letter/{id}/retry:
    post:
      operationId: adminRetryDeadLetter
      summary: Retry a dead-letter job
      description: Re-enqueues a specific dead-letter job for processing.
      tags: [Admin]
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job re-enqueued
        "404":
          $ref: "#/components/responses/NotFound"

  /ojs/v1/admin/dead-letter/{id}:
    delete:
      operationId: adminDeleteDeadLetter
      summary: Delete a dead-letter job
      description: Permanently removes a job from the dead-letter queue.
      tags: [Admin]
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "204":
          description: Job deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /ojs/v1/admin/dead-letter/retry:
    post:
      operationId: adminBulkRetryDeadLetter
      summary: Bulk retry dead-letter jobs
      description: Re-enqueues all or filtered dead-letter jobs.
      tags: [Admin]
      responses:
        "200":
          description: Jobs re-enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  retried:
                    type: integer

  # ── Real-Time Events ─────────────────────────────────────────────────

  /ojs/v1/jobs/{id}/events:
    get:
      operationId: subscribeJobEvents
      summary: Subscribe to job events (SSE)
      description: |
        Opens a Server-Sent Events stream for real-time updates on a specific job.
        The stream emits state change events and closes when the job reaches a terminal state.
      tags: [Events]
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /ojs/v1/queues/{name}/events:
    get:
      operationId: subscribeQueueEvents
      summary: Subscribe to queue events (SSE)
      description: |
        Opens a Server-Sent Events stream for real-time updates on all jobs in a queue.
        Events include state changes, progress updates, and job completions.
      tags: [Events]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string

  /ojs/v1/ws:
    get:
      operationId: websocketConnect
      summary: WebSocket connection
      description: |
        Upgrades to a WebSocket connection for bidirectional real-time communication.
        Supports subscribe/unsubscribe commands and receives job events.
        Not available on all backends.
      tags: [Events]
      responses:
        "101":
          description: WebSocket upgrade

  # ── Schema Registry API ─────────────────────────────────────────────

  /ojs/v1/schemas:
    post:
      operationId: registerSchema
      summary: Register a job schema
      description: |
        Registers a JSON Schema for a specific job type. Enables server-side
        validation of job args on enqueue. Supports schema versioning —
        each registration creates a new version.
      tags: [Schema Registry]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job_type, schema]
              properties:
                job_type:
                  type: string
                  description: The job type this schema validates.
                schema:
                  type: object
                  description: A JSON Schema (draft 2020-12) for the job args.
                description:
                  type: string
                  description: Human-readable description of this schema version.
      responses:
        "201":
          description: Schema registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_type:
                    type: string
                  version:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /ojs/v1/schemas/{jobType}:
    get:
      operationId: getSchema
      summary: Get latest schema for a job type
      description: Returns the latest registered schema for the given job type.
      tags: [Schema Registry]
      parameters:
        - name: jobType
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Schema details
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSchema
      summary: Delete all schema versions for a job type
      description: Removes all schema versions for the given job type.
      tags: [Schema Registry]
      parameters:
        - name: jobType
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Schema deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /ojs/v1/schemas/{jobType}/versions:
    get:
      operationId: listSchemaVersions
      summary: List schema versions
      description: Returns all registered schema versions for a job type.
      tags: [Schema Registry]
      parameters:
        - name: jobType
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Schema version list
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items:
                      type: object
        "404":
          $ref: "#/components/responses/NotFound"

  /ojs/v1/schemas/{jobType}/versions/{version}:
    get:
      operationId: getSchemaVersion
      summary: Get a specific schema version
      description: Returns a specific version of the schema for a job type.
      tags: [Schema Registry]
      parameters:
        - name: jobType
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Schema version details
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSchemaVersion
      summary: Delete a specific schema version
      description: Removes a specific version of the schema for a job type.
      tags: [Schema Registry]
      parameters:
        - name: jobType
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Schema version deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /ojs/v1/schemas/{jobType}/validate:
    post:
      operationId: validateAgainstSchema
      summary: Validate args against schema
      description: Validates a set of job args against the registered schema for a job type without enqueuing.
      tags: [Schema Registry]
      parameters:
        - name: jobType
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                args:
                  type: array
                  description: The job args to validate.
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /ojs/v1/schemas/{jobType}/compatibility:
    put:
      operationId: setSchemaCompatibility
      summary: Set compatibility mode for a job type
      description: |
        Sets the schema compatibility checking mode for a job type.
        Modes: `none`, `backward`, `forward`, `full`.
      tags: [Schema Registry]
      parameters:
        - name: jobType
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [none, backward, forward, full]
      responses:
        "200":
          description: Compatibility mode updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_type:
                    type: string
                  mode:
                    type: string
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Debug API (Experimental — not yet implemented in all backends) ───

  /ojs/v1/debug/status:
    get:
      operationId: debugStatus
      summary: Get debug status
      description: |
        Returns internal server state for debugging. Backend-specific; may not
        be available on all implementations.

        > **Experimental:** This endpoint is defined in the spec but not yet
        > implemented in all backends. Check the manifest for availability.
      tags: [Debug]
      responses:
        "200":
          description: Debug status
          content:
            application/json:
              schema:
                type: object

  /ojs/v1/debug/jobs/{id}/traces:
    get:
      operationId: debugGetTraces
      summary: Get job execution traces
      description: Returns execution trace history for a job across all attempts.
      tags: [Debug]
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Trace data
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"

  /ojs/v1/debug/jobs/{id}/traces/{attempt}:
    get:
      operationId: debugGetTraceAttempt
      summary: Get trace for specific attempt
      description: Returns execution trace for a specific attempt of a job.
      tags: [Debug]
      parameters:
        - $ref: "#/components/parameters/JobId"
        - name: attempt
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trace data for attempt
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"

  /ojs/v1/debug/failures:
    get:
      operationId: debugListFailures
      summary: List recent failures
      description: Returns recent job failures with error details for debugging.
      tags: [Debug]
      responses:
        "200":
          description: Failure list
          content:
            application/json:
              schema:
                type: object

components:
  # ── Parameters ──────────────────────────────────────────────────────
  parameters:
    JobId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Job ID (UUIDv7)

    QueueName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9][a-z0-9\-\.]*$
        maxLength: 128
      description: Queue name

    WorkflowId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Workflow ID (UUIDv7)

  # ── Reusable Responses ─────────────────────────────────────────────
  responses:
    BadRequest:
      description: Invalid request (malformed JSON, missing required fields)
      content:
        application/openjobspec+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/openjobspec+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: State conflict (e.g. cancelling a completed job, duplicate unique job)
      content:
        application/openjobspec+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ValidationError:
      description: Request validation failed (semantic errors)
      content:
        application/openjobspec+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalError:
      description: Internal server error
      content:
        application/openjobspec+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  # ── Schemas ─────────────────────────────────────────────────────────
  schemas:
    # ── Job Envelope ──────────────────────────────────────────────────
    Job:
      type: object
      description: |
        Complete OJS job envelope. Jobs progress through an 8-state lifecycle:
        `scheduled` → `available` → `active` → `completed` | `retryable` → `discarded` | `cancelled`.
      required:
        - id
        - type
        - state
        - queue
        - args
        - attempt
      properties:
        id:
          type: string
          format: uuid
          description: Unique job identifier (UUIDv7, time-ordered)
          example: "019414d4-8b2e-7c3a-b5d1-f0e2a3b4c5d6"
        type:
          type: string
          pattern: ^[a-z][a-z0-9_\-]*(\.[a-z][a-z0-9_\-]*)*$
          maxLength: 255
          description: Job type identifier (dot-separated, lowercase)
          example: "email.send"
        state:
          type: string
          enum:
            - scheduled
            - available
            - pending
            - active
            - completed
            - retryable
            - cancelled
            - discarded
          description: |
            Current lifecycle state.
            - `scheduled`: Waiting for scheduled_at time
            - `available`: Ready to be fetched
            - `pending`: Internal routing state
            - `active`: Being processed by a worker
            - `completed`: Successfully processed (terminal)
            - `retryable`: Failed, eligible for retry
            - `cancelled`: Cancelled (terminal)
            - `discarded`: Exhausted all retries (terminal)
          example: "available"
        queue:
          type: string
          pattern: ^[a-z0-9][a-z0-9\-\.]*$
          maxLength: 128
          description: Queue the job is assigned to
          example: "default"
        args:
          description: Job arguments as a JSON array. Must contain only JSON-native types.
          example: ["user@example.com", {"subject": "Welcome"}]
        meta:
          description: Optional metadata object for cross-cutting concerns
          example: {"trace_id": "abc123", "correlation_id": "order-456"}
        priority:
          type: integer
          minimum: -100
          maximum: 100
          description: Job priority (-100 lowest, 100 highest). Higher priority jobs are fetched first.
          example: 2
        attempt:
          type: integer
          minimum: 0
          description: Current attempt number (0-indexed before first execution)
          example: 1
        max_attempts:
          type: integer
          minimum: 0
          description: Maximum number of execution attempts before discarding
          example: 5
        timeout_ms:
          type: integer
          minimum: 0
          description: Job execution timeout in milliseconds
          example: 30000
        worker_id:
          type: string
          description: ID of the worker currently processing the job
          example: "worker-01.us-east-1"
        created_at:
          type: string
          format: date-time
          description: Timestamp when the job was created (ISO 8601 UTC)
          example: "2026-03-15T10:30:00Z"
        enqueued_at:
          type: string
          format: date-time
          description: Timestamp when the job became available
          example: "2026-03-15T10:30:01Z"
        started_at:
          type: string
          format: date-time
          description: Timestamp when the job was fetched by a worker
          example: "2026-03-15T10:30:05Z"
        completed_at:
          type: string
          format: date-time
          description: Timestamp when the job reached a terminal state
          example: "2026-03-15T10:30:07Z"
        cancelled_at:
          type: string
          format: date-time
          description: Timestamp when the job was cancelled
          example: "2026-03-15T10:31:00Z"
        scheduled_at:
          type: string
          format: date-time
          description: Timestamp when the job should become available (for delayed jobs)
          example: "2026-03-15T12:00:00Z"
        expires_at:
          type: string
          format: date-time
          description: Timestamp after which the job should be discarded if not yet processed
          example: "2026-03-16T10:30:00Z"
        result:
          description: Result data set by the worker on successful completion
          example: {"delivered": true, "message_id": "msg-789"}
        error:
          description: Error data from the most recent failed attempt
          example: {"code": "SMTP_TIMEOUT", "message": "Connection timed out"}
        errors:
          type: array
          items: {}
          description: Array of errors from all failed attempts
          example: [{"code": "SMTP_TIMEOUT", "message": "Connection timed out", "attempt": 1}]
        tags:
          type: array
          items:
            type: string
          description: Arbitrary tags for filtering and grouping
          example: ["urgent", "transactional"]
        retry:
          $ref: "#/components/schemas/RetryPolicy"
        unique:
          $ref: "#/components/schemas/UniquePolicy"
        retry_delay_ms:
          type: integer
          description: Computed delay in milliseconds before next retry attempt
          example: 5000
        parent_results:
          type: array
          items: {}
          description: Results from parent jobs in a workflow chain
          example: [{"step": "validate", "valid": true}]
      additionalProperties: true

    # ── Enqueue Request ───────────────────────────────────────────────
    EnqueueRequest:
      type: object
      description: Request body for enqueuing a single job
      required:
        - type
        - args
      properties:
        id:
          type: string
          format: uuid
          description: Optional client-provided UUIDv7. Server generates one if omitted.
          example: "019414d4-8b2e-7c3a-b5d1-f0e2a3b4c5d6"
        type:
          type: string
          pattern: ^[a-z][a-z0-9_\-]*(\.[a-z][a-z0-9_\-]*)*$
          maxLength: 255
          description: Job type identifier
          example: "email.send"
        args:
          type: array
          description: Job arguments. Must be a JSON array of JSON-native types.
          example: ["user@example.com", {"subject": "Welcome"}]
        meta:
          description: Optional metadata object
          example: {"trace_id": "abc123"}
        schema:
          type: string
          description: Optional schema URI for args validation
          example: "https://schemas.example.com/email-send.json"
        options:
          $ref: "#/components/schemas/EnqueueOptions"
      additionalProperties: true

    EnqueueOptions:
      type: object
      description: Optional settings for job enqueue
      properties:
        queue:
          type: string
          pattern: ^[a-z0-9][a-z0-9\-\.]*$
          maxLength: 128
          description: Target queue name (default `"default"`)
          example: "default"
        priority:
          type: integer
          minimum: -100
          maximum: 100
          description: Job priority (-100 to 100)
          example: 5
        timeout_ms:
          type: integer
          minimum: 0
          description: Job execution timeout in milliseconds
          example: 30000
        scheduled_at:
          type: string
          format: date-time
          description: |
            Schedule the job for future execution (ISO 8601 UTC).
            Supports relative durations prefixed with `+` (e.g. `+PT5S` for 5 seconds from now).
        delay_until:
          example: "2026-03-15T12:00:00Z"
          type: string
          format: date-time
          description: Alias for `scheduled_at`
          example: "2026-03-15T12:00:00Z"
        expires_at:
          type: string
          format: date-time
          description: Discard the job if not processed by this time
          example: "2026-03-16T10:30:00Z"
        retry:
          $ref: "#/components/schemas/RetryPolicy"
        retry_policy:
          $ref: "#/components/schemas/RetryPolicy"
        unique:
          $ref: "#/components/schemas/UniquePolicy"
        tags:
          type: array
          items:
            type: string
          description: Arbitrary tags for the job
          example: ["transactional", "email"]
        visibility_timeout_ms:
          type: integer
          minimum: 0
          description: Visibility timeout in milliseconds for this job
          example: 30000
        visibility_timeout:
          type: string
          description: Visibility timeout as ISO 8601 duration (e.g. `PT30S`)
          example: "PT30S"
        metadata:
          description: Alternative field for metadata (merged into `meta`)
        rate_limit:
          $ref: "#/components/schemas/RateLimitPolicy"

    # ── Batch Enqueue ─────────────────────────────────────────────────
    BatchEnqueueRequest:
      type: object
      description: Request body for batch enqueue. All jobs are processed atomically.
      required:
        - jobs
      properties:
        jobs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EnqueueRequest"
          description: Array of job enqueue requests

    BatchEnqueueResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
          description: Array of created jobs
        count:
          type: integer
          description: Number of jobs created
          example: 3

    # ── Fetch Request/Response ────────────────────────────────────────
    FetchRequest:
      type: object
      description: Request body for fetching jobs from queues
      required:
        - queues
      properties:
        queues:
          type: array
          items:
            type: string
          minItems: 1
          description: Queue names to fetch from (checked in order)
          example: ["default", "low-priority"]
        count:
          type: integer
          minimum: 1
          default: 1
          description: Maximum number of jobs to fetch
          example: 5
        worker_id:
          type: string
          description: Identifier of the requesting worker
          example: "worker-01.us-east-1"
        visibility_timeout_ms:
          type: integer
          minimum: 0
          description: Override visibility timeout in milliseconds
          example: 30000

    FetchResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
          description: Fetched jobs (empty array if none available)
        job:
          $ref: "#/components/schemas/Job"
          description: First fetched job (convenience field, present only when jobs is non-empty)

    # ── Ack Request/Response ──────────────────────────────────────────
    AckRequest:
      type: object
      description: Request body for acknowledging successful job completion
      required:
        - job_id
      properties:
        job_id:
          type: string
          format: uuid
          description: ID of the job to acknowledge
          example: "019414d4-8b2e-7c3a-b5d1-f0e2a3b4c5d6"
        result:
          description: Optional result data from the job handler
          example: {"delivered": true}

    AckResponse:
      type: object
      properties:
        acknowledged:
          type: boolean
          description: Whether the acknowledgment was accepted
          example: true
        job_id:
          type: string
          format: uuid
          description: ID of the acknowledged job
          example: "019414d4-8b2e-7c3a-b5d1-f0e2a3b4c5d6"
        state:
          type: string
          enum: [completed]
          description: Resulting job state
          example: "completed"
        completed_at:
          type: string
          format: date-time
          description: Timestamp of completion
          example: "2026-03-15T10:30:07Z"
        job:
          $ref: "#/components/schemas/Job"
          description: Full job object (optional)

    # ── Nack Request/Response ─────────────────────────────────────────
    NackRequest:
      type: object
      description: Request body for reporting job failure
      required:
        - job_id
      properties:
        job_id:
          type: string
          format: uuid
          description: ID of the failed job
          example: "019414d4-8b2e-7c3a-b5d1-f0e2a3b4c5d6"
        error:
          $ref: "#/components/schemas/JobError"
        requeue:
          type: boolean
          default: false
          description: If true, immediately requeue the job without counting as a retry attempt
          example: false

    JobError:
      type: object
      description: Structured error from a job handler
      required:
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: "SMTP_TIMEOUT"
        type:
          type: string
          description: Error type/category
          example: "connection_error"
        message:
          type: string
          description: Human-readable error message
          example: "SMTP server connection timed out after 30s"
        retryable:
          type: boolean
          description: Whether this error is retryable
          example: true
        details:
          type: object
          additionalProperties: true
          description: Additional error context
          example: {"host": "smtp.example.com", "port": 587}

    NackResponse:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
          description: ID of the failed job
          example: "019414d4-8b2e-7c3a-b5d1-f0e2a3b4c5d6"
        state:
          type: string
          enum: [retryable, discarded]
          description: Resulting job state after failure
          example: "retryable"
        attempt:
          type: integer
          description: Current attempt number
          example: 2
        max_attempts:
          type: integer
          description: Maximum attempts configured
          example: 5
        next_attempt_at:
          type: string
          format: date-time
          description: When the next retry will be attempted (if retryable)
          example: "2026-03-15T10:31:00Z"
        discarded_at:
          type: string
          format: date-time
          description: When the job was discarded (if max attempts exhausted)
          example: "2026-03-15T10:35:00Z"
        job:
          $ref: "#/components/schemas/Job"
          description: Full job object (optional)

    # ── Heartbeat Request/Response ────────────────────────────────────
    HeartbeatRequest:
      type: object
      description: Request body for worker heartbeat
      required:
        - worker_id
      properties:
        worker_id:
          type: string
          description: Worker identifier
          example: "worker-01.us-east-1"
        job_id:
          type: string
          format: uuid
          description: Single active job ID (alternative to `active_jobs`)
          example: "019414d4-8b2e-7c3a-b5d1-f0e2a3b4c5d6"
        active_jobs:
          type: array
          items:
            type: string
            format: uuid
          description: List of job IDs the worker is actively processing
          example: ["019414d4-8b2e-7c3a-b5d1-f0e2a3b4c5d6", "019414d5-1a2b-7c3d-8e4f-a5b6c7d8e9f0"]
        visibility_timeout_ms:
          type: integer
          minimum: 0
          description: Visibility timeout extension in milliseconds
          example: 60000

    HeartbeatResponse:
      type: object
      properties:
        state:
          type: string
          description: Current worker lifecycle state
          example: "active"
        directive:
          type: string
          enum: ["", "quiet", "terminate"]
          description: |
            Server directive for the worker:
            - empty string: continue normal operation
            - `quiet`: stop fetching new jobs, finish active ones
            - `terminate`: shut down gracefully
          example: ""
        jobs_extended:
          type: array
          items:
            type: string
          description: Job IDs whose visibility timeout was extended
          example: ["019414d4-8b2e-7c3a-b5d1-f0e2a3b4c5d6"]
        server_time:
          type: string
          format: date-time
          description: Server timestamp for clock synchronization
          example: "2026-03-15T10:30:30Z"

    # ── Queue Schemas ─────────────────────────────────────────────────
    QueueInfo:
      type: object
      properties:
        name:
          type: string
          description: Queue name
          example: "default"
        status:
          type: string
          enum: [active, paused]
          description: Queue status
          example: "active"
        created_at:
          type: string
          format: date-time
          description: When the queue was first seen
          example: "2026-01-10T08:00:00Z"

    QueueListResponse:
      type: object
      properties:
        queues:
          type: array
          items:
            $ref: "#/components/schemas/QueueInfo"
        pagination:
          $ref: "#/components/schemas/Pagination"

    QueueStatsResponse:
      type: object
      properties:
        queue:
          type: object
          properties:
            name:
              type: string
              description: Queue name
              example: "default"
            available:
              type: integer
              description: Jobs ready to be fetched
              example: 142
            active:
              type: integer
              description: Jobs currently being processed
              example: 8
            completed:
              type: integer
              description: Jobs that completed successfully
              example: 1520
            paused:
              type: boolean
              description: Whether the queue is paused
              example: false

    QueuePauseResumeResponse:
      type: object
      properties:
        queue:
          type: object
          properties:
            name:
              type: string
              description: Queue name
              example: "notifications"
            paused:
              type: boolean
              description: Current pause state
              example: true

    # ── Dead Letter Schemas ───────────────────────────────────────────
    DeadLetterListResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
          description: Dead letter jobs
        pagination:
          $ref: "#/components/schemas/Pagination"

    DeadLetterDeleteResponse:
      type: object
      properties:
        deleted:
          type: boolean
          description: Whether the job was deleted
          example: true
        job_id:
          type: string
          format: uuid
          description: ID of the deleted job
          example: "019414d4-8b2e-7c3a-b5d1-f0e2a3b4c5d6"

    # ── Cron Schemas ──────────────────────────────────────────────────
    CronJob:
      type: object
      description: Registered cron job definition
      properties:
        name:
          type: string
          description: Unique cron job name
          example: "daily-cleanup"
        expression:
          type: string
          description: Cron expression (5 or 6 fields)
          example: "*/5 * * * *"
        timezone:
          type: string
          description: IANA timezone for evaluation (e.g. `America/New_York`)
          example: "America/New_York"
        overlap_policy:
          type: string
          enum: [allow, skip, cancel]
          description: Behavior when a previous run is still active
          example: "skip"
        enabled:
          type: boolean
          description: Whether the cron job is active
          example: true
        job_template:
          $ref: "#/components/schemas/CronJobTemplate"
        created_at:
          type: string
          format: date-time
          example: "2026-01-10T08:00:00Z"
        next_run_at:
          type: string
          format: date-time
          description: Next scheduled execution time
          example: "2026-03-16T02:00:00Z"
        last_run_at:
          type: string
          format: date-time
          description: Last execution time
          example: "2026-03-15T02:00:00Z"

    CronJobTemplate:
      type: object
      description: Job template used when the cron schedule fires
      required:
        - type
      properties:
        type:
          type: string
          description: Job type to enqueue
          example: "maintenance.cleanup"
        args:
          description: Job arguments
          example: [{"max_age_days": 30}]
        options:
          $ref: "#/components/schemas/EnqueueOptions"

    CronJobRequest:
      type: object
      description: Request body for registering a cron job
      required:
        - name
        - expression
        - job_template
      properties:
        name:
          type: string
          description: Unique name for the cron job
          example: "daily-report"
        expression:
          type: string
          description: Cron expression
          example: "0 */6 * * *"
        timezone:
          type: string
          description: IANA timezone
          example: "UTC"
        overlap_policy:
          type: string
          enum: [allow, skip, cancel]
          example: "skip"
        job_template:
          $ref: "#/components/schemas/CronJobTemplate"

    CronJobResponse:
      type: object
      properties:
        cron:
          $ref: "#/components/schemas/CronJob"

    CronListResponse:
      type: object
      properties:
        crons:
          type: array
          items:
            $ref: "#/components/schemas/CronJob"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ── Workflow Schemas ──────────────────────────────────────────────
    WorkflowRequest:
      type: object
      description: |
        Request body for creating a workflow.
        - `chain`: Provide `steps` — jobs run sequentially.
        - `group` / `batch`: Provide `jobs` — jobs run in parallel.
      required:
        - type
      properties:
        type:
          type: string
          enum: [chain, group, batch]
          description: Workflow type
          example: "chain"
        name:
          type: string
          description: Optional human-readable workflow name
          example: "order-processing"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowJobRequest"
          description: Sequential steps (required for `chain` type)
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowJobRequest"
          description: Parallel jobs (required for `group` and `batch` types)
        callbacks:
          $ref: "#/components/schemas/WorkflowCallbacks"

    WorkflowJobRequest:
      type: object
      description: A single job definition within a workflow
      required:
        - name
        - type
        - args
      properties:
        name:
          type: string
          description: Step/job name within the workflow
          example: "validate-payment"
        type:
          type: string
          description: Job type identifier
          example: "payment.validate"
        args:
          description: Job arguments
          example: [{"order_id": "order-123"}]
        options:
          $ref: "#/components/schemas/EnqueueOptions"

    Workflow:
      type: object
      description: Stored workflow state
      properties:
        id:
          type: string
          format: uuid
          description: Workflow ID (UUIDv7)
          example: "019414d5-1a2b-7c3d-8e4f-a5b6c7d8e9f0"
        name:
          type: string
          description: Workflow name
          example: "order-processing"
        type:
          type: string
          enum: [chain, group, batch]
          description: Workflow type
          example: "chain"
        state:
          type: string
          enum: [active, completed, failed, cancelled]
          description: Current workflow state
          example: "active"
        steps_total:
          type: integer
          description: Total steps (chain workflows)
          example: 3
        steps_completed:
          type: integer
          description: Completed steps (chain workflows)
          example: 1
        jobs_total:
          type: integer
          description: Total jobs (group/batch workflows)
          example: 5
        jobs_completed:
          type: integer
          description: Completed jobs (group/batch workflows)
          example: 2
        callbacks:
          $ref: "#/components/schemas/WorkflowCallbacks"
        created_at:
          type: string
          format: date-time
          example: "2026-03-15T10:30:00Z"
        completed_at:
          type: string
          format: date-time
          example: "2026-03-15T10:35:00Z"

    WorkflowCallbacks:
      type: object
      description: Callback jobs triggered by workflow events
      properties:
        on_success:
          $ref: "#/components/schemas/WorkflowCallback"
        on_failure:
          $ref: "#/components/schemas/WorkflowCallback"
        on_complete:
          $ref: "#/components/schemas/WorkflowCallback"

    WorkflowCallback:
      type: object
      description: A callback job definition
      properties:
        type:
          type: string
          description: Job type to enqueue
          example: "notification.send"
        args:
          description: Job arguments
          example: [{"channel": "slack", "message": "Workflow complete"}]
        options:
          $ref: "#/components/schemas/EnqueueOptions"

    WorkflowResponse:
      type: object
      properties:
        workflow:
          $ref: "#/components/schemas/Workflow"

    # ── Policy Schemas ────────────────────────────────────────────────
    RetryPolicy:
      type: object
      description: Configuration for automatic retry behavior on job failure
      properties:
        max_attempts:
          type: integer
          minimum: 0
          default: 3
          description: Maximum number of execution attempts
          example: 5
        initial_interval:
          type: string
          default: "PT1S"
          description: Initial delay between retries (ISO 8601 duration, e.g. `PT1S`)
          example: "PT1S"
        backoff_coefficient:
          type: number
          format: double
          minimum: 1.0
          default: 2.0
          description: Multiplier applied to delay between successive retries
          example: 2.0
        max_interval:
          type: string
          default: "PT5M"
          description: Maximum delay between retries (ISO 8601 duration)
          example: "PT5M"
        jitter:
          type: boolean
          default: true
          description: Add random jitter to retry delays to avoid thundering herd
          example: true
        non_retryable_errors:
          type: array
          items:
            type: string
          description: Error codes that should not trigger a retry
          example: ["INVALID_INPUT", "NOT_FOUND"]
        on_exhaustion:
          type: string
          enum: [discard, dead_letter]
          description: Action when all retries are exhausted
          example: "dead_letter"
        backoff_type:
          type: string
          enum: [exponential, linear, constant]
          description: Backoff algorithm
          example: "exponential"
        backoff_strategy:
          type: string
          enum: [exponential, linear, constant]
          description: Alias for `backoff_type`
          example: "exponential"

    UniquePolicy:
      type: object
      description: Deduplication rules to prevent duplicate jobs
      properties:
        keys:
          type: array
          items:
            type: string
          description: Fields used to compute the uniqueness fingerprint
          example: ["type", "args"]
        period:
          type: string
          description: Time window for uniqueness (ISO 8601 duration)
          example: "PT1H"
        on_conflict:
          type: string
          enum: [reject, use_existing, replace]
          description: Behavior when a duplicate is detected
          example: "reject"
        states:
          type: array
          items:
            type: string
            enum: [scheduled, available, pending, active, retryable, completed]
          description: States to check for existing duplicates
          example: ["available", "active", "scheduled"]

    RateLimitPolicy:
      type: object
      description: Rate limiting configuration for a queue
      properties:
        max_per_second:
          type: integer
          minimum: 1
          description: Maximum jobs processed per second
          example: 100

    # ── Common Schemas ────────────────────────────────────────────────
    JobResponse:
      type: object
      properties:
        job:
          $ref: "#/components/schemas/Job"

    JobHistoryResponse:
      type: object
      description: Job state transition history
      properties:
        job_id:
          type: string
          format: uuid
          description: Job ID
          example: "01912b4c-8e3a-7000-8000-000000000001"
        transitions:
          type: array
          items:
            $ref: "#/components/schemas/JobStateTransition"
          description: Ordered list of state transitions (oldest first)

    JobStateTransition:
      type: object
      description: A single state transition in a job's lifecycle
      properties:
        from_state:
          type: string
          nullable: true
          enum: [null, scheduled, available, pending, active, completed, retryable, cancelled, discarded]
          description: Previous state (null for initial creation)
          example: "available"
        to_state:
          type: string
          enum: [scheduled, available, pending, active, completed, retryable, cancelled, discarded]
          description: New state after transition
          example: "active"
        timestamp:
          type: string
          format: date-time
          description: When the transition occurred
          example: "2026-03-15T10:30:05Z"
        reason:
          type: string
          description: Reason for the transition
          example: "fetched"
        worker_id:
          type: string
          description: Worker involved in the transition (if applicable)
          example: "worker-01.us-east-1"
        error:
          description: Error data (if transition was due to failure)
        result:
          description: Result data (if transition was due to completion)

    Pagination:
      type: object
      description: Pagination metadata
      properties:
        total:
          type: integer
          description: Total number of items
          example: 250
        limit:
          type: integer
          description: Maximum items per page
          example: 25
        offset:
          type: integer
          description: Number of items skipped
          example: 0
        has_more:
          type: boolean
          description: Whether more items are available
          example: true

    # ── System Schemas ────────────────────────────────────────────────
    Manifest:
      type: object
      description: Server conformance manifest
      properties:
        specversion:
          type: string
          description: OJS spec version supported
          example: "1.0"
        implementation:
          type: object
          properties:
            name:
              type: string
              description: Implementation name
              example: "ojs-server"
            version:
              type: string
              description: Implementation version
              example: "1.2.0"
            backend:
              type: string
              description: Backend type
              example: "redis"
        conformance_level:
          type: integer
          minimum: 0
          maximum: 4
          description: Conformance level (0–4, each a superset of the previous)
          example: 4
        protocols:
          type: array
          items:
            type: string
          description: Supported protocol bindings
          example: ["http", "grpc"]
        backend:
          type: string
          description: Backend type identifier
          example: "redis"
        capabilities:
          type: object
          description: Feature capability flags
          properties:
            batch_enqueue:
              type: boolean
              example: true
            cron_jobs:
              type: boolean
              example: true
            dead_letter:
              type: boolean
              example: true
            delayed_jobs:
              type: boolean
              example: true
            job_ttl:
              type: boolean
              example: true
            priority_queues:
              type: boolean
              example: true
            rate_limiting:
              type: boolean
              example: true
            schema_validation:
              type: boolean
              example: false
            unique_jobs:
              type: boolean
              example: true
            workflows:
              type: boolean
              example: true
            pause_resume:
              type: boolean
              example: true
        extensions:
          type: object
          description: Registered extensions
          properties:
            official:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  uri:
                    type: string
                  version:
                    type: string

    HealthResponse:
      type: object
      description: Health check response
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
          description: Overall server health
          example: "ok"
        version:
          type: string
          description: OJS spec version
          example: "1.0"
        uptime_seconds:
          type: integer
          description: Server uptime in seconds
          example: 86400
        backend:
          type: object
          properties:
            type:
              type: string
              description: Backend type (e.g. `redis`, `postgres`)
              example: "redis"
            status:
              type: string
              enum: [connected, disconnected, error]
              description: Backend connection status
              example: "connected"
            latency_ms:
              type: integer
              description: Backend ping latency in milliseconds
              example: 2
            error:
              type: string
              description: Error message if backend is unhealthy

    HealthDetailResponse:
      type: object
      description: Detailed health check response with backend diagnostics
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
          description: Overall server health
          example: "ok"
        version:
          type: string
          description: OJS spec version
          example: "1.0"
        uptime_seconds:
          type: integer
          description: Server uptime in seconds
          example: 86400
        backend:
          type: object
          properties:
            type:
              type: string
              description: Backend type
              example: "redis"
            status:
              type: string
              enum: [connected, disconnected, error]
              description: Backend connection status
              example: "connected"
            latency_ms:
              type: integer
              description: Backend ping latency in milliseconds
              example: 2
            version:
              type: string
              description: Backend server version
              example: "7.2.4"
            error:
              type: string
              description: Error message if backend is unhealthy
        queues:
          type: object
          properties:
            total:
              type: integer
              description: Total number of queues
              example: 5
            active:
              type: integer
              description: Number of active (unpaused) queues
              example: 4
            paused:
              type: integer
              description: Number of paused queues
              example: 1
        workers:
          type: object
          properties:
            total:
              type: integer
              description: Total registered workers
              example: 12
            active:
              type: integer
              description: Workers actively processing
              example: 10
            quiet:
              type: integer
              description: Workers in quiet mode
              example: 2
        jobs:
          type: object
          properties:
            total:
              type: integer
              description: Total job count across all states
              example: 158420
            active:
              type: integer
              description: Jobs currently being processed
              example: 45
            available:
              type: integer
              description: Jobs ready to be fetched
              example: 230
            scheduled:
              type: integer
              description: Jobs waiting for scheduled time
              example: 18
        server_time:
          type: string
          format: date-time
          description: Current server timestamp
          example: "2026-03-15T10:30:00Z"

    # ── Error Schemas ─────────────────────────────────────────────────
    ErrorResponse:
      type: object
      description: Standard OJS error response envelope
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/OJSError"

    OJSError:
      type: object
      description: |
        Structured error conforming to the OJS error format.

        Error codes:
        - `invalid_request`: Malformed request (400)
        - `validation_error`: Semantic validation failure (422)
        - `not_found`: Resource not found (404)
        - `conflict`: State conflict or duplicate (409)
        - `duplicate`: Duplicate unique job (409)
        - `queue_paused`: Operation rejected because queue is paused (409)
        - `internal_error`: Server error (500)
        - `unsupported`: Unsupported feature or version (422)
      required:
        - message
        - retryable
      properties:
        code:
          type: string
          enum:
            - invalid_request
            - validation_error
            - not_found
            - conflict
            - duplicate
            - internal_error
            - unsupported
            - queue_paused
          description: Machine-readable error code
          example: "invalid_request"
        type:
          type: string
          description: Error type (typically matches code)
          example: "invalid_request"
        message:
          type: string
          description: Human-readable error description
          example: "Invalid job payload: 'type' is required"
        retryable:
          type: boolean
          description: Whether the client should retry the request
          example: false
        details:
          type: object
          additionalProperties: true
          description: Additional context (field names, validation details, resource info)
          example: {"field": "type", "reason": "required field missing"}
        request_id:
          type: string
          description: Request ID for tracing
          example: "req-019414d4-8b2e-7c3a"
